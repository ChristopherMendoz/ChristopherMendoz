<svg xmlns="http://www.w3.org/2000/svg" width="300" height="52" viewBox="0 0 300 52" role="img" aria-label="Explorar panel interactivo">
  <title>Explorar panel interactivo</title>
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E3566A"/><stop offset="1" stop-color="#F0AB72"/>
    </linearGradient>
  </defs>
  <rect width="300" height="52" rx="26" fill="url(#b)"/>
  <rect x="1" y="1" width="298" height="50" rx="25" fill="none" stroke="#F2E6D6" stroke-opacity="0.35"/>
  <g transform="translate(20 15)" fill="#F2E6D6">
    <rect x="0" y="10" width="5" height="12" rx="1.5"><animate attributeName="height" values="12;6;12" dur="1.8s" repeatCount="indefinite"/><animate attributeName="y" values="10;16;10" dur="1.8s" repeatCount="indefinite"/></rect>
    <rect x="8" y="4" width="5" height="18" rx="1.5"><animate attributeName="height" values="18;10;18" dur="1.8s" begin="0.3s" repeatCount="indefinite"/><animate attributeName="y" values="4;12;4" dur="1.8s" begin="0.3s" repeatCount="indefinite"/></rect>
    <rect x="16" y="0" width="5" height="22" rx="1.5"><animate attributeName="height" values="22;14;22" dur="1.8s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="y" values="0;8;0" dur="1.8s" begin="0.6s" repeatCount="indefinite"/></rect>
  </g>
  <text x="54" y="32" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#F2E6D6">Explorar panel interactivo</text>
  <path d="M274 20 l6 6 l-6 6" fill="none" stroke="#F2E6D6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
