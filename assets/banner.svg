<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Christopher Mendoza · Systems Engineering Student</title>
  <desc id="desc">Banner abstracto en acuarela con tonos turquesa, azul, coral y naranja, con detalles sutiles de código.</desc>

  <defs>
    <!-- Fondo crema con un leve degradado cálido -->
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7EFE4"/>
      <stop offset="0.55" stop-color="#F2E6D6"/>
      <stop offset="1" stop-color="#EEDCC6"/>
    </linearGradient>

    <radialGradient id="gTurq" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#73B3B9" stop-opacity="0.95"/>
      <stop offset="0.7" stop-color="#73B3B9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#73B3B9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gOcean" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1E89AB" stop-opacity="0.9"/>
      <stop offset="0.65" stop-color="#1E89AB" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#1E89AB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gCoral" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E3566A" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#E3566A" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#E3566A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gOrange" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F0AB72" stop-opacity="0.95"/>
      <stop offset="0.65" stop-color="#F3B981" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#F3B981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gSage" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#B1C8C2" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#B1C8C2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gIndigo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5C5579" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#5C5579" stop-opacity="0"/>
    </radialGradient>

    <!-- Bordes orgánicos tipo acuarela -->
    <filter id="watercolor" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="55" xChannelSelector="R" yChannelSelector="G" result="warped"/>
      <feGaussianBlur in="warped" stdDeviation="3.5"/>
    </filter>

    <!-- Textura de papel muy sutil -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.36  0 0 0 0 0.33  0 0 0 0 0.47  0 0 0 0.07 0"/>
    </filter>

    <!-- Desvanece la mancha hacia el texto -->
    <linearGradient id="fadeMask" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.30" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.52" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="fade"><rect width="1200" height="340" fill="url(#fadeMask)"/></mask>

    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#5C5579" fill-opacity="0.22"/>
    </pattern>

    <clipPath id="card"><rect width="1200" height="340" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#paper)"/>

    <!-- Manchas de acuarela -->
    <g mask="url(#fade)">
      <g filter="url(#watercolor)">
        <ellipse cx="1010" cy="120" rx="250" ry="170" fill="url(#gTurq)">
          <animate attributeName="cx" values="1010;985;1010" dur="18s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="1140" cy="250" rx="200" ry="150" fill="url(#gOcean)">
          <animate attributeName="cy" values="250;232;250" dur="22s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="840" cy="260" rx="190" ry="120" fill="url(#gCoral)">
          <animate attributeName="cx" values="840;862;840" dur="20s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="780" cy="70" rx="170" ry="110" fill="url(#gOrange)"/>
        <ellipse cx="930" cy="330" rx="160" ry="70" fill="url(#gSage)"/>
        <ellipse cx="1180" cy="40" rx="130" ry="90" fill="url(#gIndigo)"/>
        <ellipse cx="660" cy="320" rx="120" ry="60" fill="url(#gOrange)" opacity="0.6"/>
      </g>
    </g>

    <!-- Retícula de puntos y trazos técnicos -->
    <rect x="690" y="0" width="510" height="340" fill="url(#dots)" mask="url(#fade)"/>
    <path d="M640 300 C 760 220, 900 330, 1040 210 S 1200 150, 1240 170" fill="none" stroke="#F2E6D6" stroke-width="1.6" stroke-opacity="0.85" stroke-dasharray="2 7" stroke-linecap="round"/>
    <path d="M700 40 C 820 120, 960 20, 1090 95" fill="none" stroke="#5C5579" stroke-width="1.2" stroke-opacity="0.35"/>
    <circle cx="1040" cy="210" r="5" fill="#F2E6D6"/>
    <circle cx="1040" cy="210" r="12" fill="none" stroke="#F2E6D6" stroke-opacity="0.7">
      <animate attributeName="r" values="8;16;8" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.8;0;0.8" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="262" r="3.5" fill="#5C5579" fill-opacity="0.6"/>
    <circle cx="1090" cy="95" r="3.5" fill="#5C5579" fill-opacity="0.6"/>

    <!-- Glifos de código -->
    <g font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" fill="#F2E6D6">
      <text x="1088" y="150" font-size="44" font-weight="700" fill-opacity="0.9">&lt;/&gt;</text>
      <text x="905" y="118" font-size="28" fill-opacity="0.75">{ }</text>
      <text x="985" y="292" font-size="20" fill-opacity="0.8">=&gt;</text>
    </g>

    <rect width="1200" height="340" filter="url(#grain)"/>

    <!-- Texto -->
    <g font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">
      <text x="72" y="118" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="18" fill="#1E89AB" letter-spacing="1">$ whoami</text>
      <text x="70" y="190" font-size="64" font-weight="700" fill="#4A4466" letter-spacing="-1">Christopher Mendoza</text>
      <rect x="72" y="214" width="56" height="4" rx="2" fill="#E3566A"/>
      <rect x="134" y="214" width="22" height="4" rx="2" fill="#F0AB72"/>
      <rect x="162" y="214" width="10" height="4" rx="2" fill="#73B3B9"/>
      <text x="72" y="262" font-size="26" font-weight="500" fill="#5C5579">Systems Engineering Student<tspan dx="6" fill="#1E89AB" font-weight="400">_<animate attributeName="fill-opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
    </g>
  </g>
</svg>
